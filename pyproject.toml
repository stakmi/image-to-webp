[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "image-to-webp"
dynamic = ["version"]
description = "Convert images in almost any format (PNG, JPEG, GIF, TIFF, HEIC, AVIF, RAW, SVG, ...) to WebP."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stakmi" }]
keywords = ["webp", "image", "convert", "converter", "heic", "raw", "svg", "pillow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
raw = ["rawpy>=0.19"]
svg = ["cairosvg>=2.7"]
all = ["image-to-webp[heif,raw,svg]"]
test = ["pytest>=7"]
dev = ["image-to-webp[all,test]", "build", "twine"]

[project.scripts]
image-to-webp = "image_to_webp.cli:main"

[project.urls]
Homepage = "https://github.com/stakmi/image-to-webp"
Repository = "https://github.com/stakmi/image-to-webp"
Issues = "https://github.com/stakmi/image-to-webp/issues"
Changelog = "https://github.com/stakmi/image-to-webp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/image_to_webp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/image_to_webp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
